title: Bien préparer une adoption
intro: Quelques conseils pour préparer sereinement l’arrivée de votre futur compagnon.
steps:
- title: Aménager un espace adapté
  text: Préparez un coin calme avec couchage, eau, nourriture et accessoires adaptés.
- title: Sécuriser le logement
  text: Vérifiez fenêtres, balcons, portes et plantes afin de limiter les risques
    d’accident.
- title: Prévoir du temps
  text: Les premiers jours demandent patience, présence et observation pour laisser
    l’animal prendre ses marques.
- title: Prendre rendez-vous chez le vétérinaire
  text: Préparez un suivi vétérinaire et vérifiez les besoins en vaccination, identification
    et prévention.
questions:
- question: Quels animaux sont disponibles ?
  answer: La liste des animaux à l’adoption est mise à jour régulièrement depuis l’espace
    d’administration.
- question: Comment rencontrer un animal ?
  answer: Contactez le refuge afin de convenir d’un rendez-vous et de discuter de
    votre projet d’adoption.
- question: Puis-je adopter un animal avec des enfants ?
  answer: Cela dépend du profil de l’animal. L’équipe vous accompagne pour choisir
    une adoption adaptée à votre foyer.
