title: Les nouvelles du refuge
intro: Suivez les nouvelles, arrivées et informations importantes de la SPAA.
news:
- date: 28 juillet 2026 · Arrivée
  title: Bienvenue à Nala, notre nouvelle pensionnaire
  description: Recueillie après un signalement de voisinage, Nala reprend des forces
    à l’infirmerie du refuge avant d’être proposée à l’adoption dans quelques semaines.
  photo: ''
- date: 15 juillet 2026 · Témoignage
  title: La famille Morel adopte Pixel
  description: Trois mois après son adoption, Pixel s’est parfaitement intégré à sa
    nouvelle famille. Un joli témoignage à lire pour celles et ceux qui hésitent encore
    à adopter.
  photo: ''
- date: 2 juillet 2026 · Info
  title: Nouveaux horaires d’ouverture pour l’été
  description: À partir du 1er juillet, le refuge est ouvert au public du mardi au
    dimanche de 10h à 18h, y compris les jours fériés.
  photo: ''
- date: 20 juin 2026 · Arrivée
  title: Six chatons arrivés au refuge
  description: Une portée de six chatons a été recueillie suite à l’abandon de leur
    mère. Ils seront proposés à l’adoption dès l’âge de deux mois.
  photo: ''
